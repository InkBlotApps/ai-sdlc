name: Deploy AI SDLC site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPO_METADATA_TOKEN: ${{ secrets.REPO_METADATA_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Update repository About website
        if: env.REPO_METADATA_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.REPO_METADATA_TOKEN }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -f homepage="${PAGE_URL}"

      - name: Explain missing metadata token
        if: env.REPO_METADATA_TOKEN == ''
        run: |
          echo "::notice::Pages deployed successfully, but the repository About website was not updated because REPO_METADATA_TOKEN is not configured."
          echo "::notice::Create a fine-grained token scoped only to this repository with Administration: Read and write, then store it as the REPO_METADATA_TOKEN Actions secret."
